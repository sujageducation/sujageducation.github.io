<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f4c3a">
  <title>Admin | SUJAG Education</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="side" aria-label="Admin menu">
    <div class="brand"><img src="logo-mark.png" alt="" width="30" height="32"><div><strong>SUJAG</strong><span>Admin panel</span></div></div>
    <nav id="nav"></nav>
    <a class="viewsite" href="index.html" target="_blank" rel="noopener">Open public website</a>
  </aside>
  <div class="main">
    <header class="top">
      <button type="button" class="btn ghost menu-btn" id="menuBtn" aria-controls="side" aria-expanded="false">Menu</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="top-actions">
        <button type="button" class="btn" id="dlBtn">Download files</button>
        <button type="button" class="btn primary" id="pubBtn">Publish changes</button>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="modal"></div><div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">The admin panel needs JavaScript.</p></noscript>
<script src="pages.js"></script>
<script src="admin-parser.js"></script>
<script src="admin-config.js"></script>
<script src="admin.js"></script>
<script src="admin-members.js"></script>
</body>
</html>
